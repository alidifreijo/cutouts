name: keepalive
# The free Supabase plan pauses a project after 7 days without activity. One tiny read every 3 days keeps it awake.
on:
  schedule: [{ cron: "17 6 */3 * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Read one row with the public key
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wybuusahvefqbxnnidky.supabase.co/rest/v1/hidden?select=id&limit=1" \
            -H "apikey: sb_publishable_T3lcQF74EXSIjbIELHPoJA_eQR0c1M3")
          echo "Supabase answered $code"
          test "$code" = "200"
