<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cutouts studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: same cutting mat as the public site. Top bar with a 4-step stepper; work area left, side panel right. Single dark look on purpose. */
:root{
  --mat:#2c6a4e;--mat-deep:#235640;--mat-dark:#173d2c;--mat-light:#3b7a5c;
  --mat-line:rgba(214,238,222,.13);--mat-line-strong:rgba(214,238,222,.30);--mat-ink:rgba(214,238,222,.62);
  --mint:#d4ecdc;--danger:#e58c84;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 8px 18px -6px rgba(0,0,0,.45);
  --f:"DM Mono",ui-monospace,Menlo,monospace;--cm:38px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--mat);color:var(--mint);font-family:var(--f);font-size:13px;
  background-image:linear-gradient(var(--mat-line-strong) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line-strong) 1px,transparent 1px),linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:calc(var(--cm)*5) calc(var(--cm)*5),calc(var(--cm)*5) calc(var(--cm)*5),var(--cm) var(--cm),var(--cm) var(--cm)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--mint);outline-offset:3px}
[hidden]{display:none!important}
.app{height:100%;height:100dvh;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--mat-deep);border-bottom:1px solid var(--mat-line-strong)}
.logo{margin:0;font-weight:500;font-size:15px;white-space:nowrap}
.logo a{color:inherit;text-decoration:none}
.logo span{color:var(--mat-ink);font-weight:400}
.steps{display:flex;gap:2px;background:var(--mat-dark);padding:3px;border-radius:999px;margin-left:8px}
.steps li{list-style:none;padding:5px 12px;border-radius:999px;font-size:12px;color:var(--mat-ink);white-space:nowrap}
.steps li[aria-current="step"]{background:var(--mat-light);color:var(--mint)}
.steps li.done{color:var(--mint)}
.steps{margin-block:0}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--mat-ink);white-space:nowrap}
.btn{border:1px solid var(--mint);background:var(--mint);color:var(--mat-dark);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:500}
.btn:hover{background:#fff;border-color:#fff}
.btn:disabled{opacity:.4;cursor:default;background:var(--mint)}
.ghost{border:1px solid var(--mat-line-strong);background:transparent;color:var(--mint);border-radius:999px;padding:7px 14px;font-size:12.5px}
.ghost:hover{border-color:var(--mint)}
.ghost[aria-pressed="true"]{background:var(--mat-light);border-color:var(--mat-light)}
.link{border:0;background:none;padding:0;color:var(--mat-ink);text-decoration:underline;text-underline-offset:3px;font-size:11.5px}
.link:hover{color:var(--mint)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.work{position:relative;min-width:0;min-height:0;display:grid;place-items:center;padding:24px}
.side{background:rgba(23,61,44,.96);border-left:1px solid var(--mat-line-strong);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 12px;scrollbar-width:thin}
.side-foot{padding:14px 18px;border-top:1px solid var(--mat-line);display:flex;gap:8px;justify-content:space-between;align-items:center}
h2{font-weight:500;font-size:15px;margin:0 0 6px;color:#fff}
.muted{color:var(--mat-ink);font-size:11.5px;line-height:1.55;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;color:var(--mat-ink)}
.input{width:100%;background:var(--mat);border:1px solid var(--mat-line-strong);border-radius:10px;padding:8px 10px;color:var(--mint);outline:none}
.input:focus{border-color:var(--mint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range{width:100%;accent-color:var(--mint)}

/* center card (login / upload) */
.card{background:rgba(23,61,44,.96);border:1px solid var(--mat-line-strong);border-radius:16px;padding:26px;width:min(420px,100%);box-shadow:var(--shadow)}
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:2px dashed var(--mat-line-strong);border-radius:16px;padding:48px 24px;width:min(560px,100%);background:rgba(23,61,44,.6);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--mint);background:rgba(23,61,44,.85)}
.drop b{font-weight:500;font-size:15px;color:#fff}
.drop input{display:none}

/* stage */
.stage{position:relative;max-width:100%;max-height:100%;touch-action:none;user-select:none}
.stage canvas{display:block;max-width:100%;max-height:calc(100dvh - 120px);box-shadow:var(--shadow)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.corner{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--mint);border:2px solid var(--mat-dark);cursor:grab;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.corner:active{cursor:grabbing}
.stage.cut{cursor:crosshair}

/* scraps list */
.tools{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.scraps{display:flex;flex-direction:column;gap:10px}
.scrap{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px;border:1px solid var(--mat-line);border-radius:12px;background:rgba(44,106,78,.35)}
.scrap.off{opacity:.55}
.scrap .th{width:56px;height:56px;border-radius:8px;background:rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden}
.scrap .th img{max-width:100%;max-height:100%}
.scrap .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.scrap .input{padding:5px 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--mat-line-strong);background:transparent;border-radius:999px;padding:2px 8px;font-size:10.5px;color:var(--mat-ink)}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--mat-dark)}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mat-ink)}
.chk input{accent-color:var(--mint)}
.x{border:0;background:none;color:var(--mat-ink);width:26px;height:26px;border-radius:50%;padding:0}
.x:hover{background:var(--mat-light);color:var(--mint)}
.empty{color:var(--mat-ink);font-size:11.5px;line-height:1.6;border:1px dashed var(--mat-line-strong);border-radius:12px;padding:16px;text-align:center}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(23,61,44,.6);font-size:12.5px;z-index:5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--mat-dark);color:var(--mint);font-size:12.5px;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);z-index:50;max-width:90vw;text-align:center}
.err{color:var(--danger)}
.preview{max-width:100%;max-height:calc(100dvh - 160px);box-shadow:var(--shadow)}
.done-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.done-list img{width:100%;aspect-ratio:1;object-fit:contain;background:rgba(0,0,0,.18);border-radius:8px;padding:4px}
.embed body{background:transparent}
.embed .logo{display:none}
.embed .bar{background:transparent;border-bottom:0;padding-top:12px}
.inbox{display:flex;flex-direction:column;gap:12px}
.ibx{border:1px solid var(--mat-line);border-radius:12px;background:rgba(44,106,78,.35);padding:8px}
.ibx img{display:block;width:100%;border-radius:6px;background:rgba(0,0,0,.2)}
.ibx .row{justify-content:space-between;margin-top:8px}
.ibx .who2{font-size:11.5px;color:var(--mat-ink)}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{border-left:0;border-top:1px solid var(--mat-line-strong);max-height:46dvh}
  .steps li:not([aria-current="step"]){display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="logo"><a href="./">cutouts</a> <span>studio</span></h1>
    <ol class="steps" id="steps">
      <li data-s="photo">1 · photo</li><li data-s="sheet">2 · straighten</li><li data-s="cut">3 · cut</li><li data-s="publish">4 · pin it</li>
    </ol>
    <div class="who" id="who" hidden><span id="who-email"></span><button class="link" id="signout">Sign out</button></div>
  </header>

  <!-- login -->
  <main class="main" id="v-login" style="grid-template-columns:1fr">
    <div class="work"><div class="card">
      <h2>Staff only</h2>
      <p class="muted">The scissors drawer is locked. Owner gets a link.</p>
      <form id="login-form">
        <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" required autocomplete="email" placeholder="email"></div>
        <button class="btn" type="submit" id="login-btn">Send me a link</button>
      </form>
      <p class="muted" id="login-msg" style="margin:14px 0 0" hidden></p>
    </div></div>
  </main>

  <!-- 1 photo -->
  <main class="main" id="v-photo" hidden>
    <div class="work">
      <label class="drop" id="drop">
        <b>Drop a new collage</b>
        <span class="muted" style="margin:0">or click to pick a photo</span>
        <input type="file" id="file" accept="image/*,.heic,.heif">
      </label>
    </div>
    <aside class="side">
      <div class="side-scroll">
        <h2>Visitors' messes</h2>
        <p class="muted" id="inbox-note">Checking…</p>
        <div class="inbox" id="inbox"></div>
      </div>
    </aside>
  </main>

  <!-- 2 sheet -->
  <main class="main" id="v-sheet" hidden>
    <div class="work"><div class="stage" id="sheet-stage"><canvas id="src-cv"></canvas><svg id="quad-svg"><polygon id="quad" fill="rgba(212,236,220,.12)" stroke="#d4ecdc" stroke-width="1.5" stroke-dasharray="6 4"/></svg></div></div>
    <aside class="side">
      <div class="side-scroll">
        <h2>Straighten it</h2>
        <p class="muted">Corners on the paper.</p>
        <div class="field"><label for="trim">Lose the table <span id="trim-v"></span></label><input class="range" type="range" id="trim" min="0" max="60" value="0"></div>
        <div class="field"><canvas id="flat-cv" style="width:100%;background:repeating-conic-gradient(#3b7a5c 0 25%,#2c6a4e 0 50%) 0 0/16px 16px;border-radius:8px"></canvas></div>
      </div>
      <div class="side-foot"><button class="ghost" data-go="photo">Back</button><button class="btn" id="to-cut">Next</button></div>
    </aside>
  </main>

  <!-- 3 cut -->
  <main class="main" id="v-cut" hidden>
    <div class="work"><div class="stage cut" id="cut-stage"><canvas id="cut-cv"></canvas><svg id="cut-svg"></svg><div class="busy" id="busy" hidden>Finding scraps…</div></div></div>
    <aside class="side">
      <div class="side-scroll">
        <h2>Cut it up</h2>
        <div class="tools" role="group" aria-label="Tool">
          <button class="ghost" data-tool="smart" aria-pressed="true" title="Draw roughly around something. It snaps to the shape.">Smart scissors</button>
          <button class="ghost" data-tool="lasso" aria-pressed="false" title="Cuts exactly where you draw.">Scissors</button>
          <button class="ghost" data-tool="rect" aria-pressed="false" title="For text strips.">Box</button>
          <button class="ghost" id="auto" title="Finds every cut-out by itself.">Find all</button>
        </div>
        <div class="scraps" id="scraps"></div>
      </div>
      <div class="side-foot"><button class="ghost" data-go="sheet">Back</button><button class="btn" id="to-pub">Next</button></div>
    </aside>
  </main>

  <!-- 4 publish -->
  <main class="main" id="v-publish" hidden>
    <div class="work"><img class="preview" id="pub-preview" alt="Collage preview"></div>
    <aside class="side">
      <div class="side-scroll" id="pub-side">
        <h2>Pin it</h2>
        <div class="field"><label for="title">Title</label><input class="input" id="title" placeholder="Untitled mess"></div>
        <div class="field"><label for="desc">Description</label><textarea class="input" id="desc" rows="3" maxlength="400" placeholder="Optional. Shows when someone zooms in." style="resize:vertical;line-height:1.45"></textarea></div>
        <p class="muted" id="pub-summary"></p>
        <div class="done-list" id="pub-list"></div>
      </div>
      <div class="side-foot"><button class="ghost" data-go="cut">Back</button><button class="btn" id="publish">Pin it</button></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://wybuusahvefqbxnnidky.supabase.co",SB_KEY="sb_publishable_T3lcQF74EXSIjbIELHPoJA_eQR0c1M3";
const ADMIN="adiazdefreijovalino@gmail.com";
const DEMO=new URLSearchParams(location.search).has("demo");
const EMBED=new URLSearchParams(location.search).has("embed");
if(EMBED)document.documentElement.classList.add("embed");
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const CLUSTERS=[["people","People"],["nature","Creatures"],["things","Things"],["heads","Headlines"],["words","Words"]];
let toastT;function toast(m,err){const t=$("#toast");t.textContent=m;t.classList.toggle("err",!!err);t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const mk=(w,h)=>{const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;

// ---------- views ----------
const VIEWS=["login","photo","sheet","cut","publish"];
function show(v){
  VIEWS.forEach(k=>$("#v-"+k).hidden=k!==v);
  const order=["photo","sheet","cut","publish"],i=order.indexOf(v);
  $$("#steps li").forEach((li,j)=>{if(j===i)li.setAttribute("aria-current","step");else li.removeAttribute("aria-current");li.classList.toggle("done",i>j)});
  $("#steps").hidden=v==="login";
  if(v==="sheet")requestAnimationFrame(layoutSheet);
  if(v==="cut")requestAnimationFrame(drawCut);
  if(v==="publish")renderPublish();
}
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));

// ---------- auth ----------
async function initAuth(){
  if(DEMO){$("#who").hidden=false;$("#who-email").textContent="demo · nothing gets pinned";show("photo");return}
  if(!sb){$("#login-msg").hidden=false;$("#login-msg").textContent="Couldn't load the login library. Check your connection.";return}
  const {data:{session}}=await sb.auth.getSession();applySession(session);
  sb.auth.onAuthStateChange((_e,s)=>applySession(s));
}
function applySession(s){
  const email=s&&s.user&&s.user.email;
  if(!email){$("#who").hidden=true;show("login");return}
  $("#who").hidden=false;$("#who-email").textContent=email;
  if(email.toLowerCase()!==ADMIN){show("login");$("#login-msg").hidden=false;$("#login-msg").textContent="Nice try. Not your drawer.";return}

async function loadInbox(){
  if(!sb)return;
  const {data,error}=await sb.from("community").select("*").eq("approved",false).order("created_at",{ascending:false});
  const el=$("#inbox"),note=$("#inbox-note");

    <img src="${SB_URL}/storage/v1/object/public/community/${r.image_path}" alt="" loading="lazy">
    ${r.title?`<b style="display:block;margin-top:8px;font-weight:500;color:#fff">${r.title.replace(/</g,"&lt;")}</b>`:""}${r.description?`<p class="muted" style="margin:4px 0 0">${r.description.replace(/</g,"&lt;")}</p>`:""}
    <div class="row"><span class="who2">${r.signed?("by "+r.signed.replace(/</g,"&lt;")):"anonymous"}</span>
    <span class="row" style="margin:0"><button class="ghost" data-ib="bin">Bin</button><button class="btn" data-ib="ok">Pin it</button></span></div></div>`).join("");
}
$("#inbox").addEventListener("click",async e=>{
  const b=e.target.closest("[data-ib]");if(!b)return;const card=b.closest(".ibx"),id=card.dataset.id;b.disabled=true;
  if(b.dataset.ib==="ok"){const {error}=await sb.from("community").update({approved:true}).eq("id",id);if(error){toast(error.message,true);b.disabled=false;return}toast("On the table.")}
  else{const {error}=await sb.from("community").delete().eq("id",id);if(error){toast(error.message,true);b.disabled=false;return}await sb.storage.from("community").remove([card.dataset.path]);toast("Binned.")}
  card.remove();if(EMBED)parent.postMessage({type:"cutouts:published"},location.origin);
  const n=$$("#inbox .ibx").length;$("#inbox-note").textContent=n?`${n} waiting for a look.`:"Nothing waiting. Quiet day.";
});
$("#login-form").onsubmit=async e=>{
  e.preventDefault();const email=$("#email").value.trim();const b=$("#login-btn");b.disabled=true;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:new URL("./?studio",location.href).href,shouldCreateUser:true}});
  b.disabled=false;const m=$("#login-msg");m.hidden=false;
  m.textContent=error?("Couldn't send the link: "+error.message):"Sent. Open it on this device.";

$("#signout").onclick=async()=>{if(sb)await sb.auth.signOut();if(EMBED)parent.postMessage({type:"cutouts:signedout"},location.origin);location.reload()};

// ---------- 1 photo ----------
let srcImg=null;
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)openFile(f)});
$("#file").onchange=e=>{const f=e.target.files[0];if(f)openFile(f);e.target.value=""};
async function openFile(f){
  let blob=f;
  if(/heic|heif/i.test(f.type)||/\.hei[cf]$/i.test(f.name)){
    toast("Converting HEIC…");
    try{if(!window.heic2any)await loadScript("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js");blob=await heic2any({blob:f,toType:"image/jpeg",quality:.9});if(Array.isArray(blob))blob=blob[0]}
    catch(err){toast("Couldn't read that HEIC. Export it as JPG and try again.",true);return}
  }
  const url=URL.createObjectURL(blob),img=new Image();
  img.onload=()=>{
    const k=Math.min(1,2200/Math.max(img.naturalWidth,img.naturalHeight)),c=mk(img.naturalWidth*k,img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);srcImg=c;URL.revokeObjectURL(url);
    quad=guessQuad(c);scraps=[];trimmed=null;$("#trim").value=guessQuad.irregular?20:0;$("#title").value="";
    show("sheet");
  };
  img.onerror=()=>toast("That file isn't an image this browser can read.",true);
  img.src=url;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

// ---------- 2 sheet: corners + perspective ----------
let quad=null,sheetCv=null,trimmed=null;
function small(c,max){const s=Math.min(1,max/Math.max(c.width,c.height)),w=Math.max(8,Math.round(c.width*s)),h=Math.max(8,Math.round(c.height*s)),t=mk(w,h),g=t.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(c,0,0,w,h);g.filter="blur(1.2px)";g.drawImage(t,0,0);return {t,w,h,s,d:g.getImageData(0,0,w,h).data}}
function bgOf(d,w,h){const rs=[],gs=[],bs=[],add=i=>{rs.push(d[i*4]);gs.push(d[i*4+1]);bs.push(d[i*4+2])};for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}const med=a=>a.sort((x,y)=>x-y)[a.length>>1];return [med(rs),med(gs),med(bs)]}
function distMap(d,w,h,bg){const m=new Float32Array(w*h);for(let i=0;i<w*h;i++){const j=i*4;m[i]=Math.hypot(d[j]-bg[0],d[j+1]-bg[1],d[j+2]-bg[2])}return m}
function otsu(m){const hist=new Array(256).fill(0);m.forEach(v=>hist[Math.min(255,v|0)]++);const n=m.length;let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sb=0,wb=0,best=0,th=60;for(let i=0;i<256;i++){wb+=hist[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*hist[i];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>best){best=v;th=i}}return th}

function homography(q){

function fitTo(c,max){const k=Math.min(1,max/Math.max(c.width,c.height));if(k===1)return c;const o=mk(c.width*k,c.height*k);const g=o.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(c,0,0,o.width,o.height);return o}
function renderPublish(){
  $("#pub-preview").src=trimmed.toDataURL("image/webp",.8);
  const lib=scraps.filter(s=>s.lib).length;
  $("#pub-summary").textContent=`Goes on the table${scraps.length?`, ${scraps.length} layer${scraps.length>1?"s":""} deep`:""}. ${lib||"No"} scrap${lib===1?"":"s"} to the pile.`;
  $("#pub-list").innerHTML=scraps.filter(s=>s.lib).map(s=>`<img src="${s.canvas.toDataURL()}" alt="${(s.name||"scrap").replace(/"/g,"&quot;")}">`).join("");
  setTimeout(()=>$("#title").focus(),30);
}
const slug=t=>(t||"collage").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32)||"collage";
const webp=(c,q=.82)=>new Promise(r=>c.toBlob(r,"image/webp",q));
$("#publish").onclick=async()=>{
  const btn=$("#publish");btn.disabled=true;
  try{
    const title=$("#title").value.trim()||"Untitled",base=slug(title)+"-"+Math.random().toString(36).slice(2,6);
    const col=fitTo(trimmed,1000),k=col.width/trimmed.width;
    const pieces=scraps.map((s,i)=>({s,id:base+"-"+(i+1)+"-"+slug(s.name).slice(0,16),img:fitTo(s.canvas,600)}));
    const depths=[.5,1,.8,.65,.95,.7,.9];
    const layers=pieces.filter(p=>p.s.par).map((p,i)=>({id:p.id,x:+(p.s.box[0]/trimmed.width*100).toFixed(2),y:+(p.s.box[1]/trimmed.height*100).toFixed(2),w:+(p.s.box[2]/trimmed.width*100).toFixed(2),d:depths[i%depths.length],src:SB_URL+"/storage/v1/object/public/scraps/"+p.id+".webp"}));
    const description=$("#desc").value.trim()||null;
    const row={id:base,title,description,image_path:base+".webp",w:col.width,h:col.height,layers,sort:Date.now()%2147483647};
    const srows=pieces.filter(p=>p.s.lib).map((p,i)=>({id:p.id,title:p.s.name||title+" "+(i+1),cluster:p.s.cluster,image_path:p.id+".webp",w:p.img.width,h:p.img.height,collage_id:base,sort:row.sort}));
    if(DEMO){console.log({row,srows});toast("Demo: nothing pinned.");btn.disabled=false;return}
    btn.textContent="Gluing…";
    const up=async(bucket,path,c)=>{const {error}=await sb.storage.from(bucket).upload(path,await webp(c),{contentType:"image/webp",upsert:false});if(error)throw new Error(bucket+": "+error.message)};
    await up("collages",row.image_path,col);
    for(const p of pieces)await up("scraps",p.id+".webp",p.img);
    let r=await sb.from("collages").insert(row);
    if(r.error&&/description/.test(r.error.message)){const {description:_d,...rest}=row;r=await sb.from("collages").insert(rest)}
    if(r.error)throw new Error(r.error.message);
    if(srows.length){r=await sb.from("scraps").insert(srows);if(r.error)throw new Error(r.error.message)}
    $("#pub-side").innerHTML=`<h2>Pinned.</h2><p class="muted">“${title.replace(/</g,"&lt;")}” is on the table. ${srows.length} new scrap${srows.length===1?"":"s"} in the pile.</p><div class="row"><a class="btn" href="./" id="see" style="text-decoration:none">See the mess</a><button class="ghost" id="again">Another one</button></div>`;
    $("#again").onclick=()=>location.reload();
    if(EMBED){parent.postMessage({type:"cutouts:published"},location.origin);$("#see").onclick=e=>{e.preventDefault();parent.postMessage({type:"cutouts:show"},location.origin)}}btn.hidden=true;$$('#v-publish [data-go]').forEach(b=>b.hidden=true);
  }catch(err){console.error(err);toast("Couldn't publish: "+err.message,true);btn.textContent="Pin it";btn.disabled=false}
};

initAuth();
</script>
</body>
</html>
